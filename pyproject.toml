[tool.uv.workspace]
members = ["cubecore", "apps/api"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["cubecore/tests"]

[tool.pyright]
include = ["cubecore", "apps"]
exclude = ["**/.venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
